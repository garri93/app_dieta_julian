<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan Carlos García - Rutina y Dieta</title>
    
    <!-- Configuración para PWA e Iconos -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff3838">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link class="app-icon" rel="apple-touch-icon" href="icon-192.png">
    
    <style>
        /* Estructura limpia y estética original */
        body {
            background-color: #0f0f12;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background: #16161a;
            border: 1px solid rgba(255, 56, 56, 0.2);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 40px rgba(255, 56, 56, 0.1);
        }
        .logo-container {
            margin-bottom: 25px;
        }
        .logo-container img {
            width: 120px;
            height: 120px;
            border-radius: 24px;
            box-shadow: 0 0 20px rgba(255, 56, 56, 0.4);
        }
        h1 {
            font-size: 24px;
            margin: 10px 0;
            color: #ffffff;
            font-weight: 700;
        }
        p {
            color: #a0a0ab;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        
        /* Contenedor de entrada de series (Súper integrado y limpio) */
        .series-box {
            background: #1f1f27;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: left;
            border: 1px solid rgba(255, 56, 56, 0.1);
        }
        .series-box h3 {
            margin: 0 0 12px 0;
            color: #ff3838;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .input-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 12px;
            color: #a0a0ab;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            background: #121216;
            border: 1px solid #2d2d3d;
            border-radius: 8px;
            padding: 10px;
            color: white;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus {
            border-color: #ff3838;
            outline: none;
        }

        /* Lista de Series Dinámicas */
        .set-row {
            display: grid;
            grid-template-columns: 1fr 2fr 2fr auto;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }
        .set-row span {
            font-size: 13px;
            color: #ff3838;
            font-weight: bold;
            text-align: center;
        }
        .set-row input {
            padding: 6px;
            text-align: center;
        }
        
        /* Botones integrados en la estética original */
        .btn {
            background: #ff3838;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 15px rgba(255, 56, 56, 0.4);
            margin-top: 10px;
        }
        .btn:hover {
            background: #e02f2f;
        }
        .btn-add-set {
            background: #2d2d3d;
            color: #ffffff;
            font-size: 12px;
            padding: 8px;
            border-radius: 8px;
            box-shadow: none;
            margin-bottom: 15px;
        }
        .btn-add-set:hover {
            background: #3d3d52;
        }
        .btn-danger {
            background: transparent;
            color: #ff4d4d;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            padding: 0 5px;
        }

        /* Botón específico para borrar del historial */
        .btn-delete-log {
            background: transparent;
            color: #ff4d4d;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            padding: 0 4px;
            transition: color 0.2s;
        }
        .btn-delete-log:hover {
            color: #ff1a1a;
        }

        /* Historial y Copias de Seguridad */
        .history-section {
            margin-top: 25px;
            border-top: 1px solid #2d2d3d;
            padding-top: 20px;
            text-align: left;
        }
        .history-title {
            font-size: 14px;
            color: #a0a0ab;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .log-item {
            background: #121216;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 13px;
            border-left: 3px solid #ff3838;
        }
        .backup-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 15px;
        }
        .btn-sec {
            background: #2d2d3d;
            color: white;
            border: none;
            padding: 8px;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
        }
        #file-input {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-container">
            <img src="icon-192.png" alt="Logo">
        </div>
        <h1>Plan Carlos García</h1>
        <p>Registra tus series de hoy de forma rápida.</p>

        <!-- BLOQUE DE REGISTRO INTEGRADO -->
        <div class="series-box">
            <h3>Nueva Entrada</h3>
            
            <div class="input-group">
                <label for="ejercicio-nombre">Ejercicio:</label>
                <input type="text" id="ejercicio-nombre" placeholder="Ej: Press de Banca">
            </div>

            <!-- Aquí se van sumando las filas de series -->
            <div id="sets-list"></div>
            
            <button class="btn btn-add-set" onclick="agregarFilaSerie()">+ Añadir Serie</button>
        </div>

        <button class="btn" onclick="guardarEntrenamiento()">Guardar Registro</button>

        <!-- HISTORIAL COMPACTO -->
        <div class="history-section">
            <div class="history-title">Historial Reciente</div>
            <div id="historial"></div>
            
            <div class="backup-buttons">
                <button class="btn-sec" onclick="exportarDatos()">Exportar copia</button>
                <button class="btn-sec" onclick="document.getElementById('file-input').click()">Importar copia</button>
            </div>
            <input type="file" id="file-input" accept=".json" onchange="importarDatos(event)">
        </div>
    </div>

    <script>
        let serieCount = 0;

        document.addEventListener('DOMContentLoaded', () => {
            agregarFilaSerie(); // Empieza con una serie lista por defecto
            mostrarHistorial();
        });

        // Añade una fila de Serie (Peso + Reps) manteniendo el diseño limpio
        function agregarFilaSerie() {
            serieCount++;
            const container = document.getElementById('sets-list');
            const rowId = `set-row-${serieCount}`;

            const html = `
                <div class="set-row" id="${rowId}">
                    <span>S${container.children.length + 1}</span>
                    <input type="number" class="set-weight" placeholder="Peso (kg)" step="0.5">
                    <input type="number" class="set-reps" placeholder="Reps" step="1">
                    <button class="btn-danger" onclick="eliminarFila('${rowId}')">×</button>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
        }

        function eliminarFila(id) {
            const row = document.getElementById(id);
            if (row) {
                row.remove();
                reordenarNumerosSeries();
            }
        }

        function reordenarNumerosSeries() {
            const filas = document.querySelectorAll('#sets-list .set-row');
            filas.forEach((fila, index) => {
                fila.querySelector('span').innerText = `S${index + 1}`;
            });
        }

        // --- Guardado local y persistencia ---
        
        function obtenerDatos() {
            const datos = localStorage.getItem('planCarlosSeriesUnicas');
            return datos ? JSON.parse(datos) : [];
        }

        function guardarEntrenamiento() {
            const nombreEjercicio = document.getElementById('ejercicio-nombre').value.trim();
            if (!nombreEjercicio) {
                alert('Por favor, escribe el nombre del ejercicio.');
                return;
            }

            const series = [];
            const filas = document.querySelectorAll('#sets-list .set-row');

            filas.forEach((fila, index) => {
                const peso = fila.querySelector('.set-weight').value;
                const reps = fila.querySelector('.set-reps').value;
                if (peso || reps) {
                    series.push({
                        numero: index + 1,
                        peso: peso || 0,
                        reps: reps || 0
                    });
                }
            });

            if (series.length === 0) {
                alert('Añade al menos el peso o las repeticiones de una serie.');
                return;
            }

            const nuevoRegistro = {
                fecha: new Date().toLocaleDateString('es-ES'),
                hora: new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }),
                ejercicio: nombreEjercicio,
                series: series
            };

            const historial = obtenerDatos();
            historial.unshift(nuevoRegistro);
            localStorage.setItem('planCarlosSeriesUnicas', JSON.stringify(historial));

            // Limpiar campos y reiniciar
            document.getElementById('ejercicio-nombre').value = '';
            document.getElementById('sets-list').innerHTML = '';
            agregarFilaSerie();
            mostrarHistorial();
            alert('¡Registro guardado con éxito!');
        }

        function mostrarHistorial() {
            const historial = obtenerDatos();
            const contenedor = document.getElementById('historial');

            if (historial.length === 0) {
                contenedor.innerHTML = '<p style="font-size:12px; color:#666; margin:0;">Aún no tienes series registradas.</p>';
                return;
            }

            // Mostramos los últimos 8 registros (puedes ajustar el número)
            contenedor.innerHTML = historial.slice(0, 8).map((item, index) => {
                const strSeries = item.series.map(s => `S${s.numero}: <strong>${s.peso} kg</strong> x ${s.reps}`).join(' | ');
                return `
                    <div class="log-item">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; font-weight:bold;">
                            <span>${item.ejercicio}</span>
                            <div style="display:flex; align-items:center; gap:8px;">
                                <span style="color:#666; font-size:11px;">${item.fecha}</span>
                                <button class="btn-delete-log" onclick="eliminarRegistro(${index})" title="Borrar registro">×</button>
                            </div>
                        </div>
                        <div style="color:#a0a0ab; font-size:11px;">${strSeries}</div>
                    </div>
                `;
            }).join('');
        }

        // --- Eliminar un registro específico ---
        function eliminarRegistro(index) {
            if (confirm('¿Seguro que quieres borrar este registro de tu historial?')) {
                const historial = obtenerDatos();
                historial.splice(index, 1); // Elimina el elemento seleccionado del array
                localStorage.setItem('planCarlosSeriesUnicas', JSON.stringify(historial));
                mostrarHistorial(); // Actualiza el historial en pantalla
            }
        }

        // --- Exportar / Importar ---

        function exportarDatos() {
            const datos = localStorage.getItem('planCarlosSeriesUnicas');
            if (!datos || datos === '[]') {
                alert('No hay registros para exportar.');
                return;
            }
            const blob = new Blob([datos], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `series_carlos_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importarDatos(evento) {
            const archivo = evento.target.files[0];
            if (!archivo) return;

            const lector = new FileReader();
            lector.onload = function(e) {
                try {
                    const datos = JSON.parse(e.target.result);
                    if (Array.isArray(datos)) {
                        if (confirm('¿Quieres importar estos registros? Reemplazará lo que tengas ahora en este móvil.')) {
                            localStorage.setItem('planCarlosSeriesUnicas', JSON.stringify(datos));
                            mostrarHistorial();
                            alert('Datos importados correctamente.');
                        }
                    } else {
                        alert('Archivo no válido.');
                    }
                } catch (err) {
                    alert('Error al leer el archivo.');
                }
            };
            lector.readAsText(archivo);
        }

        // SW
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registrado'))
                    .catch(err => console.error(err));
            });
        }
    </script>
</body>
</html>
