<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan Carlos García - Rutina y Dieta</title>
    
    <!-- Configuración para PWA e Iconos -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff3838">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <style>
        /* Estilos básicos originales */
        body {
            background-color: #0f0f12;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background: #16161a;
            border: 1px solid rgba(255, 56, 56, 0.2);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 40px rgba(255, 56, 56, 0.1);
        }
        .logo-container {
            margin-bottom: 25px;
        }
        .logo-container img {
            width: 120px;
            height: 120px;
            border-radius: 24px;
            box-shadow: 0 0 20px rgba(255, 56, 56, 0.4);
        }
        h1 {
            font-size: 24px;
            margin: 10px 0;
            color: #ffffff;
            font-weight: 700;
        }
        p {
            color: #a0a0ab;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .btn {
            background: #ff3838;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(255, 56, 56, 0.4);
        }
        .btn:hover {
            background: #e02f2f;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 56, 56, 0.6);
        }
        .btn:active {
            transform: translateY(0);
        }

        /* Nuevos estilos específicos para las series y el historial (adaptados a tu diseño original) */
        .set-row {
            display: grid;
            grid-template-columns: 1fr 2fr 2fr auto;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }
        .set-row span {
            font-size: 13px;
            color: #ff3838;
            font-weight: bold;
            text-align: center;
        }
        .set-row input {
            background: #121216;
            border: 1px solid #2d2d3d;
            border-radius: 8px;
            padding: 8px;
            color: white;
            box-sizing: border-box;
            text-align: center;
            font-size: 14px;
        }
        .set-row input:focus {
            border-color: #ff3838;
            outline: none;
        }
        .btn-danger {
            background: transparent;
            color: #ff4d4d;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            padding: 0 5px;
        }
        .log-item {
            background: #121216;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 13px;
            border-left: 3px solid #ff3838;
        }
        .btn-delete-log {
            background: transparent;
            color: #ff4d4d;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            padding: 0 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-container">
            <img src="icon-192.png" alt="Logo Plan Carlos García">
        </div>
        <h1>Plan Carlos García</h1>
        <p>Tu rutina de entrenamiento personalizada y control de dieta listos para llevar a cualquier parte.</p>

        <!-- SECCIÓN DE REGISTRO INTEGRADA -->
        <div style="text-align: left; margin-top: 20px; border-top: 1px solid rgba(255, 56, 56, 0.2); padding-top: 20px;">
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-size: 13px; color: #a0a0ab; margin-bottom: 5px;">Ejercicio:</label>
                <input type="text" id="ejercicio-nombre" placeholder="Ej: Press de Banca" style="width: 100%; background: #121216; border: 1px solid #2d2d3d; border-radius: 8px; padding: 10px; color: white; box-sizing: border-box; font-size: 14px; font-family: inherit;">
            </div>

            <!-- Listado dinámico de series -->
            <div id="sets-list"></div>
            
            <button class="btn" style="background: #2d2d3d; box-shadow: none; padding: 8px; font-size: 13px; border-radius: 8px; margin-bottom: 15px; width: 100%;" onclick="agregarFilaSerie()">+ Añadir Serie</button>
            <button class="btn" style="width: 100%;" onclick="guardarEntrenamiento()">Guardar Registro</button>
        </div>

        <!-- SECCIÓN DE HISTORIAL Y COPIAS -->
        <div style="text-align: left; margin-top: 25px; border-top: 1px solid rgba(255, 56, 56, 0.2); padding-top: 20px;">
            <h3 style="font-size: 14px; color: #ff3838; margin: 0 0 10px 0; text-transform: uppercase; letter-spacing: 1px;">Historial Reciente</h3>
            <div id="historial" style="max-height: 180px; overflow-y: auto; margin-bottom: 15px;"></div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <button class="btn" style="background: #2d2d3d; box-shadow: none; padding: 8px; font-size: 12px; border-radius: 8px;" onclick="exportarDatos()">Exportar copia</button>
                <button class="btn" style="background: #2d2d3d; box-shadow: none; padding: 8px; font-size: 12px; border-radius: 8px;" onclick="document.getElementById('file-input').click()">Importar copia</button>
            </div>
            <input type="file" id="file-input" accept=".json" style="display: none;" onchange="importarDatos(event)">
        </div>
    </div>

    <!-- Scripts de funcionalidad, persistencia y Service Worker -->
    <script>
        let serieCount = 0;

        document.addEventListener('DOMContentLoaded', () => {
            agregarFilaSerie(); // Inicia con una fila de serie vacía
            mostrarHistorial();
        });

        // Añade series de forma dinámica manteniendo el diseño
        function agregarFilaSerie() {
            serieCount++;
            const container = document.getElementById('sets-list');
            const rowId = `set-row-${serieCount}`;

            const html = `
                <div class="set-row" id="${rowId}">
                    <span>S${container.children.length + 1}</span>
                    <input type="number" class="set-weight" placeholder="Peso (kg)" step="0.5">
                    <input type="number" class="set-reps" placeholder="Reps" step="1">
                    <button class="btn-danger" onclick="eliminarFila('${rowId}')">×</button>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
        }

        function eliminarFila(id) {
            const row = document.getElementById(id);
            if (row) {
                row.remove();
                reordenarNumerosSeries();
            }
        }

        function reordenarNumerosSeries() {
            const filas = document.querySelectorAll('#sets-list .set-row');
            filas.forEach((fila, index) => {
                fila.querySelector('span').innerText = `S${index + 1}`;
            });
        }

        // --- Almacenamiento local (LocalStorage) ---

        function obtenerDatos() {
            const datos = localStorage.getItem('planCarlosSeriesUnicas');
            return datos ? JSON.parse(datos) : [];
        }

        function guardarEntrenamiento() {
            const nombreEjercicio = document.getElementById('ejercicio-nombre').value.trim();
            if (!nombreEjercicio) {
                alert('Por favor, escribe el nombre del ejercicio.');
                return;
            }

            const series = [];
            const filas = document.querySelectorAll('#sets-list .set-row');

            filas.forEach((fila, index) => {
                const peso = fila.querySelector('.set-weight').value;
                const reps = fila.querySelector('.set-reps').value;
                if (peso || reps) {
                    series.push({
                        numero: index + 1,
                        peso: peso || 0,
                        reps: reps || 0
                    });
                }
            });

            if (series.length === 0) {
                alert('Añade al menos el peso o las repeticiones de una serie.');
                return;
            }

            const nuevoRegistro = {
                fecha: new Date().toLocaleDateString('es-ES'),
                hora: new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }),
                ejercicio: nombreEjercicio,
                series: series
            };

            const historial = obtenerDatos();
            historial.unshift(nuevoRegistro);
            localStorage.setItem('planCarlosSeriesUnicas', JSON.stringify(historial));

            // Reiniciar campos tras guardar
            document.getElementById('ejercicio-nombre').value = '';
            document.getElementById('sets-list').innerHTML = '';
            agregarFilaSerie();
            mostrarHistorial();
            alert('¡Registro guardado con éxito!');
        }

        function mostrarHistorial() {
            const historial = obtenerDatos();
            const contenedor = document.getElementById('historial');

            if (historial.length === 0) {
                contenedor.innerHTML = '<p style="font-size:12px; color:#666; margin:0; text-align:center;">Sin series registradas.</p>';
                return;
            }

            contenedor.innerHTML = historial.slice(0, 8).map((item, index) => {
                const strSeries = item.series.map(s => `S${s.numero}: <strong>${s.peso} kg</strong> x ${s.reps}`).join(' | ');
                return `
                    <div class="log-item">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; font-weight:bold;">
                            <span>${item.ejercicio}</span>
                            <div style="display:flex; align-items:center; gap:8px;">
                                <span style="color:#666; font-size:11px;">${item.fecha}</span>
                                <button class="btn-delete-log" onclick="eliminarRegistro(${index})" title="Borrar registro">×</button>
                            </div>
                        </div>
                        <div style="color:#a0a0ab; font-size:11px;">${strSeries}</div>
                    </div>
                `;
            }).join('');
        }

        function eliminarRegistro(index) {
            if (confirm('¿Seguro que quieres borrar este registro de tu historial?')) {
                const historial = obtenerDatos();
                historial.splice(index, 1);
                localStorage.setItem('planCarlosSeriesUnicas', JSON.stringify(historial));
                mostrarHistorial();
            }
        }

        // --- Exportación / Importación ---

        function exportarDatos() {
            const datos = localStorage.getItem('planCarlosSeriesUnicas');
            if (!datos || datos === '[]') {
                alert('No hay registros para exportar.');
                return;
            }
            const blob = new Blob([datos], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `series_carlos_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importarDatos(evento) {
            const archivo = evento.target.files[0];
            if (!archivo) return;

            const lector = new FileReader();
            lector.onload = function(e) {
                try {
                    const datos = JSON.parse(e.target.result);
                    if (Array.isArray(datos)) {
                        if (confirm('¿Quieres importar estos registros? Reemplazará lo que tengas ahora en este móvil.')) {
                            localStorage.setItem('planCarlosSeriesUnicas', JSON.stringify(datos));
                            mostrarHistorial();
                            alert('Datos importados correctamente.');
                        }
                    } else {
                        alert('Archivo de copia no válido.');
                    }
                } catch (err) {
                    alert('Error al leer el archivo.');
                }
            };
            lector.readAsText(archivo);
        }

        // Registro del Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registrado con éxito:', reg.scope))
                    .catch(err => console.error('Error al registrar el Service Worker:', err));
            });
        }
    </script>
</body>
</html>
